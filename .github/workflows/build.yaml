# Home Assistant Operating System Build Workflow
# Optimized for private repository (twfjcn) - no GHCR push required
name: HAOS Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      boards:
        description: 'Target boards (comma-separated, e.g. panther-x2,ova)'
        required: false
        type: string
        default: "panther-x2"
      publish:
        description: 'Publish to R2 storage (only for official repo)'
        required: true
        type: boolean
        default: false
      run_tests:
        description: 'Include test builds (adds OVA board)'
        required: true
        type: boolean
        default: false
      hassio_channel:
        description: 'Hass.io release channel'
        type: choice
        required: true
        default: default
        options:
          - default
          - stable
          - beta
          - dev

# Global Configuration
env:
  # Core settings
  PYTHON_VERSION: "3.13"
  BUILD_TIMEOUT: 180  # minutes
  REPO_OWNER: ${{ github.repository_owner }}
  
  # Path configuration
  WORKSPACE: ${{ github.workspace }}
  CACHE_DIR: /mnt/build-cache
  OUTPUT_DIR: /mnt/build-output
  ARTIFACT_RETENTION: 7  # days
  
  # Docker settings
  BUILDER_IMAGE: ghcr.io/${{ github.repository_owner }}/haos-builder:latest
  DOCKER_BUILDKIT: 1

# Default execution settings
defaults:
  run:
    shell: bash
    working-directory: ${{ env.WORKSPACE }}

jobs:
  # --------------------------------------------------------------------------
  # Preparation Stage: Environment setup, versioning, and builder image build
  # --------------------------------------------------------------------------
  prepare:
    name: Prepare Build Environment
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write  # Required for public repos only
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.full }}
      version_main: ${{ steps.version.outputs.main }}
      version_dev: ${{ steps.version_dev.outputs.suffix }}
      channel: ${{ steps.channel.outputs.channel }}
      hassio_channel: ${{ steps.channel.outputs.hassio }}
      matrix: ${{ steps.matrix.outputs.config }}
      publish: ${{ steps.publish_check.outputs.enabled }}
      self_signed_cert: ${{ steps.certs.outputs.self_signed }}
      builder_image: ${{ steps.builder.outputs.image }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Determine Publish Status
        id: publish_check
        run: |
          # Only enable publish for official repo
          if [[ "${{ github.repository }}" == "home-assistant/operating-system" && "${{ inputs.publish }}" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Development Version Suffix
        id: version_dev
        if: ${{ github.event_name != 'release' }}
        run: |
          # Generate unique dev version suffix
          BASE_SUFFIX="dev-$(date -u +%Y%m%d)"
          if [[ "${{ github.ref }}" != "refs/heads/dev" ]]; then
            BASE_SUFFIX="${BASE_SUFFIX}-$(date +%s)"
          fi
          echo "suffix=${BASE_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "Generated dev suffix: ${BASE_SUFFIX}"

      - name: Update Version Metadata
        if: ${{ github.event_name != 'release' }}
        env:
          VERSION_SUFFIX: ${{ steps.version_dev.outputs.suffix }}
        run: |
          META_FILE="${WORKSPACE}/buildroot-external/meta"
          
          # Create meta file if missing
          if [[ ! -f "$META_FILE" ]]; then
            echo "::warning:: Creating default meta file"
            echo -e "VERSION_MAJOR=12\nVERSION_MINOR=0\nVERSION_SUFFIX=\"\"" > "$META_FILE"
          fi
          
          # Update version suffix
          sed -i -E "s/(^VERSION_SUFFIX=).*/\1\"${VERSION_SUFFIX}\"/" "$META_FILE"
          cat "$META_FILE" | grep VERSION

      - name: Extract Version Information
        id: version
        run: |
          # Load version metadata
          source "${WORKSPACE}/buildroot-external/meta"
          
          # Validate version components
          if [[ -z "${VERSION_MAJOR}" || -z "${VERSION_MINOR}" ]]; then
            echo "::error:: Missing version information in meta file"
            exit 1
          fi
          
          # Build version strings
          VERSION_MAIN="${VERSION_MAJOR}.${VERSION_MINOR}"
          VERSION_FULL="${VERSION_MAIN}${VERSION_SUFFIX:+.${VERSION_SUFFIX//\"/}}"
          
          echo "main=${VERSION_MAIN}" >> "$GITHUB_OUTPUT"
          echo "full=${VERSION_FULL}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${VERSION_FULL}"

      - name: Validate Release Version
        if: ${{ github.event_name == 'release' }}
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          BUILD_VERSION="${{ steps.version.outputs.full }}"
          
          if [[ "${BUILD_VERSION}" != "${RELEASE_TAG}" ]]; then
            echo "::error:: Version mismatch! Build: ${BUILD_VERSION}, Release: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Determine Build Channels
        id: channel
        run: |
          # Base channel (stable/beta/dev)
          if [[ "${{ github.event_name }}" == "release" ]]; then
            BASE_CHANNEL=$([ "${{ github.event.release.prerelease }}" == "true" ] && echo "beta" || echo "stable")
          else
            BASE_CHANNEL="dev"
          fi
          
          # Hass.io channel mapping
          INPUT_CHANNEL="${{ inputs.hassio_channel }}"
          if [[ "${INPUT_CHANNEL}" == "default" ]]; then
            HASSIO_CHANNEL=$([ "${BASE_CHANNEL}" == "stable" ] && echo "BR2_PACKAGE_HASSIO_CHANNEL_STABLE" || echo "BR2_PACKAGE_HASSIO_CHANNEL_DEV")
          else
            case "${INPUT_CHANNEL}" in
              stable) HASSIO_CHANNEL="BR2_PACKAGE_HASSIO_CHANNEL_STABLE" ;;
              beta) HASSIO_CHANNEL="BR2_PACKAGE_HASSIO_CHANNEL_BETA" ;;
              dev) HASSIO_CHANNEL="BR2_PACKAGE_HASSIO_CHANNEL_DEV" ;;
              *) 
                echo "::warning:: Invalid channel '${INPUT_CHANNEL}', using dev"
                HASSIO_CHANNEL="BR2_PACKAGE_HASSIO_CHANNEL_DEV"
                ;;
            esac
          fi
          
          echo "channel=${BASE_CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "hassio=${HASSIO_CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Generate Build Matrix
        id: matrix
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            try {
              // Load board configuration
              const matrixFile = require('./.github/workflows/matrix.json');
              const allBoards = Array.isArray(matrixFile) ? matrixFile : matrixFile.boards;
              
              // Determine target boards
              const isRelease = '${{ github.event_name }}' === 'release';
              const inputBoards = '${{ inputs.boards }}'.trim().split(',').filter(b => b);
              const includeTests = '${{ inputs.run_tests }}' === 'true';
              
              let targetBoards = [];
              
              if (isRelease) {
                // Build all boards for release
                targetBoards = allBoards;
              } else if (inputBoards.length > 0) {
                // Filter boards from input
                targetBoards = allBoards.filter(b => inputBoards.includes(b.id));
                
                // Add OVA board for testing if needed
                if (includeTests && !inputBoards.includes('ova')) {
                  const ovaBoard = allBoards.find(b => b.id === 'ova');
                  if (ovaBoard) targetBoards.push(ovaBoard);
                }
              } else {
                // Default to panther-x2
                targetBoards = allBoards.filter(b => b.id === 'panther-x2');
              }
              
              // Fallback if no boards found
              if (targetBoards.length === 0) {
                console.log('No valid boards found, using default panther-x2');
                targetBoards = [{ id: 'panther-x2', defconfig: 'panther_x2_defconfig' }];
              }
              
              return { config: { board: targetBoards } };
            } catch (error) {
              console.error('Matrix error:', error.message);
              // Safe fallback configuration
              return { config: { board: [{ id: 'panther-x2', defconfig: 'panther_x2_defconfig' }] } };
            }

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          install: true
          driver-opts: network=host

      - name: Build HAOS Builder Image
        id: builder
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.BUILDER_IMAGE }}
          # Cache configuration
          cache-from: |
            type=local,src=/tmp/buildx-cache
            type=registry,ref=${{ env.BUILDER_IMAGE }}:cache-${{ steps.version.outputs.main }}
          cache-to: |
            type=local,dest=/tmp/buildx-cache-new,mode=max
            type=registry,ref=${{ env.BUILDER_IMAGE }}:cache-${{ steps.version.outputs.main }},mode=max
          # Private repo: load only, no push
          push: ${{ env.REPO_OWNER != 'twfjcn' }}
          load: ${{ env.REPO_OWNER == 'twfjcn' }}
          outputs: ${{ env.REPO_OWNER == 'twfjcn' && 'type=docker,dest=/tmp/haos-builder.tar' || '' }}
          # Performance optimizations
          provenance: false
          sbom: false
          pull: true

      - name: Relocate Build Cache
        run: |
          rm -rf /tmp/buildx-cache
          mv /tmp/buildx-cache-new /tmp/buildx-cache

      - name: Export Builder Image Name
        run: |
          if [[ "${{ env.REPO_OWNER }}" == "twfjcn" ]]; then
            IMAGE_REF="${{ env.BUILDER_IMAGE }}"
          else
            IMAGE_REF="${{ env.BUILDER_IMAGE }}@${{ steps.builder.outputs.digest }}"
          fi
          echo "image=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "Using builder image: ${IMAGE_REF}"

      - name: Generate RAUC Certificates
        id: certs
        if: ${{ !secrets.RAUC_CERTIFICATE || !secrets.RAUC_PRIVATE_KEY }}
        run: |
          echo "::warning:: Generating self-signed RAUC certificates"
          
          # Prepare script directory
          SCRIPT_DIR="${WORKSPACE}/buildroot-external/scripts"
          mkdir -p "${SCRIPT_DIR}"
          SCRIPT_PATH="${SCRIPT_DIR}/generate-signing-key.sh"
          
          # Check for existing script
          if [[ ! -f "${SCRIPT_PATH}" ]]; then
            echo "::error:: Signing script not found at ${SCRIPT_PATH}"
            exit 1
          fi
          
          # Generate certificates
          chmod +x "${SCRIPT_PATH}"
          "${SCRIPT_PATH}" cert.pem key.pem
          
          # Verify generation
          if [[ -f "cert.pem" && -f "key.pem" ]]; then
            echo "self_signed=true" >> "$GITHUB_OUTPUT"
            echo "Successfully generated self-signed certificates"
          else
            echo "::error:: Certificate generation failed"
            exit 1
          fi

      - name: Upload Signing Certificates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ steps.certs.outputs.self_signed == 'true' }}
        with:
          name: rauc-certs
          path: |
            cert.pem
            key.pem
          retention-days: 1
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Build Stage: Per-board HAOS image compilation
  # --------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.board.id }}
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ env.BUILD_TIMEOUT }}
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: ${{ github.event_name == 'release' }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Load Local Builder Image (twfjcn)
        if: ${{ env.REPO_OWNER == 'twfjcn' }}
        run: |
          echo "Loading local builder image..."
          docker load < /tmp/haos-builder.tar
          docker image inspect ${{ env.BUILDER_IMAGE }}
          echo "✅ Builder image loaded successfully"

      - name: Setup Python Environment
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            **/requirements.txt
            .github/workflows/requirements.txt

      - name: Install AWS CLI for R2
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        run: |
          pip install --upgrade pip
          pip install 'awscli<1.37.0' boto3 botocore
          aws --version || echo "::warning:: AWS CLI verification failed"

      - name: Maximize Build Disk Space
        run: |
          echo "=== Disk Space Before Cleanup ==="
          df -h
          
          # Critical cleanup for large builds
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt-get autoremove -y --purge
          sudo apt-get clean -y
          sudo rm -rf /var/lib/apt/lists/*
          
          # Remove large unused packages
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/graalvm
          sudo rm -rf /opt/ghc /usr/share/swift /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          
          # Create build directories
          sudo mkdir -p ${{ env.CACHE_DIR }} ${{ env.OUTPUT_DIR }}
          sudo chown -R $USER:$USER ${{ env.CACHE_DIR }} ${{ env.OUTPUT_DIR }}
          ln -sf ${{ env.OUTPUT_DIR }} ${{ env.WORKSPACE }}/output
          
          echo "=== Disk Space After Cleanup ==="
          df -h

      - name: Download RAUC Certificates
        if: ${{ needs.prepare.outputs.self_signed_cert == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rauc-certs
          path: ${{ env.WORKSPACE }}

      - name: Configure RAUC Certificates
        run: |
          echo "Configuring RAUC certificates..."
          RAUC_DIR="${WORKSPACE}/buildroot-external/rauc"
          mkdir -p "${RAUC_DIR}"
          
          # Install certificates
          if [[ "${{ needs.prepare.outputs.self_signed_cert }}" == "true" ]]; then
            cp "${WORKSPACE}/cert.pem" "${RAUC_DIR}/"
            cp "${WORKSPACE}/key.pem" "${RAUC_DIR}/"
          else
            echo "${{ secrets.RAUC_CERTIFICATE }}" > "${RAUC_DIR}/cert.pem"
            echo "${{ secrets.RAUC_PRIVATE_KEY }}" > "${RAUC_DIR}/key.pem"
          fi
          
          # Secure permissions
          chmod 600 "${RAUC_DIR}"/*.pem
          ls -la "${RAUC_DIR}"

      - name: Restore Build Cache
        uses: actions/cache/restore@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ${{ env.CACHE_DIR }}
          key: haos-build-${{ matrix.board.id }}-${{ github.sha }}
          restore-keys: |
            haos-build-${{ matrix.board.id }}-
            haos-build-

      - name: Generate Board Configuration
        uses: "./.github/actions/haos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.builder_image }}
          command: make ${{ matrix.board.defconfig }}_defconfig
        env:
          BR2_EXTERNAL: ${{ env.WORKSPACE }}/buildroot-external
          BR2_CONFIG: ${{ env.OUTPUT_DIR }}/.config

      - name: Apply Channel Configuration
        if: ${{ needs.prepare.outputs.hassio_channel != 'BR2_PACKAGE_HASSIO_CHANNEL_STABLE' }}
        uses: "./.github/actions/haos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.builder_image }}
          command: |
            bash -c 'echo "${{ needs.prepare.outputs.hassio_channel }}=y" >> ${{ env.OUTPUT_DIR }}/.config && make olddefconfig'

      - name: Compile HAOS Image
        uses: "./.github/actions/haos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.builder_image }}
          command: make -j$(nproc)
        env:
          BR2_JLEVEL: $(nproc)
          BR2_CONFIG: ${{ env.OUTPUT_DIR }}/.config
          BR2_EXTERNAL: ${{ env.WORKSPACE }}/buildroot-external
          TMPDIR: /tmp

      - name: Validate Linux Configuration
        uses: "./.github/actions/haos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.builder_image }}
          command: |
            make BR2_CHECK_DOTCONFIG_OPTS="--github-format --strip-path-prefix=/build/" linux-check-dotconfig

      - name: Save Build Cache
        uses: actions/cache/save@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        if: ${{ github.ref == 'refs/heads/dev' }}
        with:
          path: ${{ env.CACHE_DIR }}
          key: haos-build-${{ matrix.board.id }}-${{ github.sha }}

      - name: Upload to R2 Storage
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        working-directory: ${{ env.OUTPUT_DIR }}/images
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_OS_ARTIFACTS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_OS_ARTIFACTS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # Validate credentials
          if [[ -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "::warning:: AWS credentials not configured"
            exit 0
          fi
          
          # Upload with retry logic
          VERSION="${{ needs.prepare.outputs.version }}"
          BOARD="${{ matrix.board.id }}"
          BUCKET="${{ secrets.R2_OS_ARTIFACTS_BUCKET }}"
          ENDPOINT="${{ secrets.R2_OS_ARTIFACTS_ENDPOINT }}"
          
          echo "Uploading ${BOARD} build to R2 (version: ${VERSION})..."
          for attempt in {1..3}; do
            if aws s3 sync \
                ./ \
                "s3://${BUCKET}/${VERSION}/${BOARD}/" \
                --exclude "*" \
                --include "haos_*" \
                --endpoint-url "${ENDPOINT}"; then
              echo "✅ Upload successful (attempt ${attempt})"
              exit 0
            fi
            echo "⚠️ Upload attempt ${attempt} failed, retrying in 15s..."
            sleep 15
          done
          
          echo "::error:: All upload attempts failed"
          exit 1

      - name: Upload Release Assets
        if: ${{ github.event_name == 'release' }}
        uses: shogo82148/actions-upload-release-asset@8f6863c6c894ba46f9e676ef5cccec4752723c1e # v1.9.2
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ env.OUTPUT_DIR }}/images/haos_*
          asset_name: haos-${{ needs.prepare.outputs.version }}-${{ matrix.board.id }}.img.xz
          asset_content_type: application/x-xz

      - name: Generate Build Summary
        run: |
          echo "# Build Summary - ${{ matrix.board.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "## Basic Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: ${{ needs.prepare.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Channel**: ${{ needs.prepare.outputs.channel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Hass.io Channel**: ${{ needs.prepare.outputs.hassio_channel }}" >> "$GITHUB_STEP_SUMMARY"
          
          echo "## Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size (Bytes) | Human Readable |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------------|----------------|" >> "$GITHUB_STEP_SUMMARY"
          
          # List build artifacts
          for file in ${{ env.OUTPUT_DIR }}/images/haos_*; do
            if [[ -f "$file" ]]; then
              name=$(basename "$file")
              size_bytes=$(du -b "$file" | cut -f1)
              size_human=$(du -bh "$file" | cut -f1)
              echo "| $name | $size_bytes | $size_human |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: haos-${{ needs.prepare.outputs.version }}-${{ matrix.board.id }}
          path: |
            ${{ env.OUTPUT_DIR }}/images/haos_*
            ${{ env.OUTPUT_DIR }}/.config
            ${{ env.WORKSPACE }}/buildroot-external/meta
          retention-days: ${{ env.ARTIFACT_RETENTION }}
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Completion Stage: Final status check and reporting
  # --------------------------------------------------------------------------
  complete:
    name: Build Completion
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    if: ${{ always() }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check Build Status
        run: |
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "::error:: ❌ One or more board builds failed"
            exit 1
          elif [[ "${{ needs.build.result }}" == "cancelled" ]]; then
            echo "::warning:: ⚠️ Build workflow was cancelled"
            exit 0
          else
            echo "::notice:: ✅ All builds completed successfully"
            exit 0
          fi

      - name: Generate Build Report
        run: |
          # Create comprehensive build report
          cat > build-report.md << EOF
          # HAOS Build Report
          **Build Time**: $(date -u)
          **Version**: ${{ needs.prepare.outputs.version }}
          **Trigger**: ${{ github.event_name }}
          **Commit**: ${{ github.sha }}
          **Channel**: ${{ needs.prepare.outputs.channel }}
          
          ## Built Boards
          - $(echo '${{ toJSON(matrix.board) }}' | jq -r '.[].id' | tr '\n' ' ' | sed 's/ $//')
          
          ## Artifacts
          - Artifact retention: ${{ env.ARTIFACT_RETENTION }} days
          - Builder image: ${{ needs.prepare.outputs.builder_image }}
          EOF
          
          # Display report
          cat build-report.md

      - name: Upload Build Report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-report-${{ needs.prepare.outputs.version }}
          path: build-report.md
          retention-days: ${{ env.ARTIFACT_RETENTION }}
